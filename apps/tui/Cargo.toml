[package]
name = "ruse-tui"
edition.workspace = true
version.workspace = true
license.workspace = true

# `bench = false` on the lib+bin so `cargo bench` runs ONLY the criterion `[[bench]]` targets (which
# accept criterion's flags), not the unit tests under the std harness (`ruse bench` relies on this).
[lib]
bench = false

[[bin]]
name = "ruse"
path = "src/main.rs"
bench = false

[dependencies]
ruse-core = { path = "../../crates/core" }
crossterm = "0.28"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# F-006 render diff: paint by grapheme CLUSTER (so `👨‍👩‍👧` is one cell pair, not three glyphs) with
# display-cell widths (wide CJK = 2). Same crates the core coordinate layer uses (F-002); in the tree.
unicode-segmentation = "1"
unicode-width = "0.2"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"

# F-010 live capability probe: a `poll()` liveness net so startup never hangs on a terminal that
# never answers DA1 (the fence, not the clock, decides support). Unix-only; other targets fall back
# to the env/default ledger. Already in the tree via crossterm — no new transitive weight.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Benchmarking harness (D-042). Lean features: keep cargo-bench integration, drop rayon + plotters/gnuplot.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Property-based tests of the input-engine state machine (no pending leak, orthogonal-axis invariants).
proptest = { version = "1", default-features = false, features = ["std"] }
# Parity fixture corpus is JSON-in-YAML (a subset of YAML 1.2); serde_json reads it with no YAML dep.
serde_json = "1"

[[bench]]
name = "highlight_parse"
harness = false

[[bench]]
name = "input_dispatch"
harness = false

[[bench]]
name = "line_index"
harness = false
