[package]
name = "ruse-tui"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ruse"
path = "src/main.rs"

[dependencies]
ruse-core = { path = "../../crates/core" }
crossterm = "0.28"
tree-sitter = "0.26.11"
tree-sitter-highlight = "0.26.11"
tree-sitter-rust = "0.24.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Benchmarking harness (D-042). Lean features: keep cargo-bench integration, drop rayon + plotters/gnuplot.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Property-based tests of the input-engine state machine (no pending leak, orthogonal-axis invariants).
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "highlight_parse"
harness = false
