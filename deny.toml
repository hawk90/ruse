# cargo-deny policy (#1311, docs/operations/ci-cd-and-release.md §11): the license and bans checks.
# Run `cargo deny check licenses bans sources` (the `cargo-deny` step of spec/verification.yaml).
# Advisories are NOT checked here: security.yml runs cargo-audit against the RustSec database, which
# needs the network; this file only reads Cargo.lock and the crates' metadata.

[graph]
all-features = true

[licenses]
# Every license must be compatible with distributing ruse under MIT. Add one only after checking that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are publish = false (Cargo.toml); skip them, their MIT license is ours.
ignore = true

[bans]
# Several versions of one crate cost build time and size but are not a defect: report, do not fail.
multiple-versions = "warn"
# A `*` requirement makes builds depend on whatever is newest.
wildcards = "deny"
allow-wildcard-paths = true
# Crates that must never enter the tree. openssl: D-034 prefers RustCrypto/rustls-style pure-Rust crates.
deny = [
    { crate = "openssl", reason = "native TLS/crypto; use a vetted pure-Rust crate (DEP-CRYPTO-HASH)" },
    { crate = "openssl-sys", reason = "native TLS/crypto; use a vetted pure-Rust crate (DEP-CRYPTO-HASH)" },
]

[sources]
# Only crates.io; a git or other-registry dependency needs a D-034 review first.
unknown-registry = "deny"
unknown-git = "deny"
