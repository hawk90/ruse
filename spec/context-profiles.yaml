# Context profiles — manifest for task-scoped LLM context packs.
# A generator (xtask, D-022) will build .context/<name>.md by concatenating the referenced sources/IDs.
# Until then this is just the manifest describing what each pack should contain.
# include entries are file names or IDs (F-*, C-*, ENG-*, ARCH-*, D-*, INV-*, or doc paths).
#
# An include with a `#anchor` focuses the reader on a section without narrowing the hash — the whole
# file is still tracked for staleness, but the pack lists the anchor as a "focus:" hint. This is how a
# profile pulls only the RELEVANT anti-pattern categories (docs/anti-patterns/anti-patterns.md#<CODE>)
# instead of all ~447. Anti-pattern IDs are not graph nodes, so they can only be referenced this way.

version: 1

always_include: [PROJECT.md, CONTEXT.md]   # every pack starts with these

profiles:
  core-editing:
    purpose: Work on document/transaction/undo/anchor and the edit flow.
    include:
      - F-001
      - F-002
      - F-005
      - ARCH-FLOW-001
      - ARCH-OWN-001
      - ENG-TXN-001
      - ENG-POS-001
      - D-001
      - D-005
      - ../docs/architecture/architecture.md#3
      - ../docs/anti-patterns/anti-patterns.md#CORE
      - ../docs/anti-patterns/anti-patterns.md#TEXT
      - ../docs/anti-patterns/anti-patterns.md#ASYNC
      - ../docs/anti-patterns/anti-patterns.md#DET
      - ../docs/anti-patterns/anti-patterns.md#ID

  input-and-commands:
