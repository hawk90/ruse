    include:
      - F-003
      - F-004
      - C-CONFIG
      - ENG-CMD-001
      - ENG-PROFILE-001
      - D-006
      - D-008
      - ../docs/parity/vim.md
      - ../docs/architecture/architecture.md#1
      - ../docs/design/config-model.md
      - ../docs/anti-patterns/anti-patterns.md#VIM
      - ../docs/anti-patterns/anti-patterns.md#EMACS
      - ../docs/anti-patterns/anti-patterns.md#PROFILE
      - ../docs/anti-patterns/anti-patterns.md#CMD
