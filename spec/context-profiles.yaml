      - ../docs/anti-patterns/anti-patterns.md#RENDER
      - ../docs/anti-patterns/anti-patterns.md#RIR
      - ../docs/anti-patterns/anti-patterns.md#TERMOUT
      - ../docs/anti-patterns/anti-patterns.md#TUX
