# ruse long-horizon design-requirement registry (DR-*): the source of truth for each requirement's status.
# Edit items in place; never renumber ids. Schema and rules: docs/architecture/design-requirements-registry.md.
# Scope: DR-* design requirements only. Product features stay in spec/PRD.yaml (F-*).
# Statuses verified against code on 2026-10-05 (code wins over docs; conflicts in notes).
schema: 1
updated: '2026-10-05'
sources:
  - docs/architecture/design-requirements.md (§1–§20, DR-* list before 2026-10-05)
statuses:
  done: 'requirement satisfied now: governance/spec items have an artifact that is enforced or in use; runtime items are implemented
    in crates/core or apps/tui with a test'
  partial: specified/designed (docs/design, spec/, RFC, D-record) but not implemented or enforced, or implemented only in
    part
  todo: not addressed beyond the requirement text
  dropped: intentionally out of scope (reason in notes)
items:
