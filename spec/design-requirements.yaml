  - id: PERSIST-006
    title: Atomic replace on save; per-platform fsync / metadata / permission policy
    area: persist
    priority: P0
    status: partial
    acceptance:
      - Save writes a temp file, fsyncs, renames over the target
      - The directory is fsynced on Unix
      - File permissions and metadata are preserved per platform
    evidence:
      - apps/tui/src/persist/atomic.rs::save
      - apps/tui/tests/persist_roundtrip.rs::atomic_save_preserves_crlf_and_is_durable
    legacy_ids:
      - DR-PERSIST-6
    source:
      - design-requirements.md §3 Persistence & Crash Consistency
    notes: 'Atomic + durable done. Permission/metadata preservation is missing: the temp file is created with default mode,
      so a save drops the executable bit, and renaming over a symlink replaces the link with a regular file (bug, not fixed).'
