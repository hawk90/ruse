# PRD — Requirements source of truth.
# LLM rules: patch a single ID; never renumber; delete = status:dropped; keep summary to 1-2 sentences.
# Enums (closed sets):
#   stage:    mvp | post-mvp | future
#   priority: must | should | could
#   status:   planned | active | blocked | done | dropped
# Defaults when omitted: priority=should, status=planned.
# IDs: F-xxx feature, C-xxx component. depends_on references C-/F- IDs. Prose lives in ../docs (by ID).
#
# Each feature carries a `trace:` block giving end-to-end traceability parity -> design -> verify:
#   trace.parity  = parity IDs the feature must satisfy (VIM-*/NVIM-*/EMACS-*/COM-*/TERM-*/WS-*/REM-*/
#                   REM-SERVICE-*/ECO-*/NAT-*), defined in ../docs/parity/*.md (index: ../docs/parity/README.md).
#                   Omitted when a feature genuinely has no external parity target.
#   trace.design  = 1-3 design/architecture docs that specify it (../docs/architecture/* | ../docs/design/*).
#   trace.verify  = planned test fixture path(s)/method that will prove it (../tests/...).
# `acceptance:` lists 2-4 concrete, testable pass criteria.
# Feature <-> capability links are NOT stored here: they live in spec/capabilities.yaml as `prd:` on CAP-*
# entries (one fact, one home). Do not add a `capability` field to features.

version: 1

product:
  name: ruse
  goal: >
    A terminal-first, remote-first, extensible editor with Vim/Neovim/Emacs feature parity,
    designed as a specification with a reference implementation.
  target_users:
    - terminal-first developers
    - remote developers

mvp:
  non_goals: [gui, web, marketplace, wasm-plugin-host, collaborative-editing, running-vimscript-or-elisp]

# --- Components (architectural building blocks) ---
# `build_stage` = bring-up order (kernel < input < tui < workspace < plugin < remote); a component may not
# depend on a later stage (checked by spec validate). `depends_on` makes build order machine-verifiable.  # D-036

components:
  # kernel (stage 1: editor-core, includes Command per ARCH-LAYER-001)
  C-DOCUMENT:   { title: Document model, build_stage: kernel, depends_on: [], status: planned, ref: ../docs/rfc/proposed/RFC-0008-document-model.md }
  C-TRANSACTION: { title: Transaction engine, build_stage: kernel, depends_on: [C-DOCUMENT], status: planned, ref: ../docs/rfc/proposed/RFC-0007-transaction-engine.md }
  C-ANCHOR:     { title: Anchor/position model, build_stage: kernel, depends_on: [C-DOCUMENT], status: planned, ref: ../docs/design/anchor-store.md }   # D-023
  C-UNDO:       { title: Undo history, build_stage: kernel, depends_on: [C-TRANSACTION], status: planned, ref: ../docs/design/persistence-and-recovery.md }
  C-REGISTER:   { title: Register/kill-ring model, build_stage: kernel, depends_on: [C-DOCUMENT], status: planned, ref: ../docs/design/register-model.md }   # D-026
  C-REGEX:      { title: Regex abstraction + Vim-dialect engine, build_stage: kernel, depends_on: [], status: planned, ref: ../docs/design/vim-regex.md }          # D-028
  C-POSHIST:    { title: Positions history (marks/jumplist/mark-ring/selections), build_stage: kernel, depends_on: [C-ANCHOR], status: planned, ref: ../docs/design/positions-history.md }  # D-027
  C-CONTEXT:    { title: Context/when-expression evaluator, build_stage: kernel, depends_on: [], status: planned, ref: ../docs/design/command-engine.md }
  C-QUERY:      { title: Read/query layer, build_stage: kernel, depends_on: [C-DOCUMENT], status: planned, ref: ../docs/design/query-and-snapshot.md }
  C-COMMAND:    { title: Semantic command layer, build_stage: kernel, depends_on: [C-TRANSACTION, C-QUERY, C-CONTEXT], status: planned, ref: ../docs/design/command-engine.md }
  C-EDITLANG:   { title: Editing-language composition (operator/motion/range IR), build_stage: kernel, depends_on: [C-COMMAND, C-ANCHOR, C-REGISTER], status: planned, ref: ../docs/design/editing-language.md }  # D-025
  C-CONFIG:     { title: Config/keymap loading + merge, build_stage: kernel, depends_on: [], status: planned, ref: ../docs/design/config-model.md }
  C-HEALTH:     { title: Health/observability, build_stage: kernel, depends_on: [], status: planned, ref: ../docs/design/stability-and-observability.md }
  C-SCHEDULER:  { title: Background scheduler, build_stage: kernel, depends_on: [], status: planned, ref: ../docs/design/scheduler.md }
  # input (stage 2)
  C-INPUT:      { title: Input engine + profiles, build_stage: input, depends_on: [C-COMMAND, C-EDITLANG, C-CONFIG], status: planned, ref: ../docs/design/input-engine.md }
  # tui (stage 3)
  C-RENDER:     { title: Render IR + lowering, build_stage: tui, depends_on: [C-QUERY], status: planned, ref: ../docs/design/render-and-frontends.md }
  C-VIEW:       { title: View/Window/layout, build_stage: tui, depends_on: [C-RENDER, C-ANCHOR], status: planned, ref: ../docs/design/view-window-workspace.md }
  C-TERMINAL:   { title: Terminal platform (input+capability), build_stage: tui, depends_on: [], status: planned, ref: ../docs/architecture/architecture.md#6 }
  # workspace (stage 4)
  C-WORKSPACE:  { title: Workspace + buffers, build_stage: workspace, depends_on: [C-DOCUMENT, C-VIEW], status: planned, ref: ../docs/design/view-window-workspace.md }
  C-PERSIST:    { title: Persistence + recovery journal, build_stage: workspace, depends_on: [C-DOCUMENT, C-WORKSPACE], status: planned, ref: ../docs/design/persistence-and-recovery.md }  # D-005
  C-LSPHOST:    { title: Language Service host (LSP mgmt + normalized model), build_stage: workspace, depends_on: [C-WORKSPACE, C-QUERY], status: planned, ref: ../docs/design/remote-runtime.md }
  C-DEBUG:      { title: Debug service (DAP/GDB, location model), build_stage: workspace, depends_on: [C-WORKSPACE], status: planned, ref: ../docs/design/remote-runtime.md }  # D-032
  # plugin (stage 5) / remote (stage 6)
  C-PLUGIN:     { title: Plugin protocol/host, build_stage: plugin, depends_on: [C-COMMAND, C-RENDER, C-WORKSPACE], status: planned, ref: ../docs/rfc/proposed/RFC-0003-plugin-api.md }
  C-AGENT:      { title: Remote workspace agent (headless service supervisor), build_stage: remote, depends_on: [C-WORKSPACE, C-LSPHOST, C-DEBUG], status: planned, ref: ../docs/design/remote-runtime.md }  # D-029/D-030/D-031
  C-REMOTE:     { title: Remote client/runtime boundary, build_stage: remote, depends_on: [C-WORKSPACE, C-PLUGIN, C-AGENT], status: planned, ref: ../docs/design/remote-runtime.md }

# --- Features ---
features:
  F-001:
    title: Transactional editing
    stage: mvp
    priority: must
    status: done
    depends_on: [C-DOCUMENT, C-TRANSACTION]
    summary: Every document change is applied as a tracked, reversible transaction.
    trace:
      parity: [COM-7, VIM-UNDO-1, EMACS-EDIT-1]
      design: [../docs/architecture/architecture.md#3]
      verify: [../tests/property/undo-roundtrip, ../tests/unit/transaction-revision]
    acceptance:
      - Undo after an edit restores the byte-identical original document.
      - Every change records an origin and a revision.
      - Applying a transaction strictly increases the document revision (monotonic).
      - A transaction applies atomically or not at all (no partial-apply state).

  F-002:
    title: Document & coordinate model
    stage: mvp
    priority: must
    # done (#98): the coordinate/anchor model is ruse KERNEL ARCHITECTURE (C-DOCUMENT/C-ANCHOR). All
    # four acceptance criteria met+tested. #1 anchors survive edits (anchor.rs + property tests). #3
    # anchor gravity left/right (anchor.rs Bias truth table). #4 byte/char/grapheme/cell are distinct
    # types, each REAL now: pos.rs byte_to_grapheme/grapheme_to_byte (UAX#29, unicode-segmentation) +
    # byte_to_cell (wcwidth, unicode-width, tab-aware). #2 the CURSOR moves by GRAPHEME CLUSTER
    # (motion::next_grapheme/prev_grapheme via GraphemeCursor; MoveLeft/MoveRight) so emoji/ZWJ/
    # combining never desync it — tested (editor_spine::cursor_moves_by_grapheme_cluster + combining;
    # pos::tests). This relaxed the dep-free-core rule (approach A, decided 2026-08-10): core now
    # carries unicode-segmentation + unicode-width. Display-cell CURSOR PLACEMENT (rendering wide
    # chars at the right column) is F-006's job; #2 here is the LOGICAL cursor staying on clusters.
    # Census-N/A (D-043): extmarks (NVIM-EXT), markers (EMACS-EDIT-2), width (TERM-WIDTH) are
    # cross-editor coordinate FACTS with no enumerable census surface; the 9 F-002-only rows are
    # backlogged (TERM-WIDTH-1 stays derived via its render co-citer).
    status: done
    depends_on: [C-DOCUMENT, C-ANCHOR]
    summary: Typed byte/char/grapheme/screen-cell coordinates; positions tracked as anchors.
    trace:
      parity: []
      design: [../docs/architecture/architecture.md#3, ../docs/design/positions-history.md]
      verify: [../tests/property/anchor-stability, ../tests/unit/coordinate-widths]
    acceptance:
      - Cursor/decoration positions survive edits via anchors, not raw offsets.
      - Wide/emoji/combining/ZWJ clusters do not desync the cursor from logical text.
      - Anchor gravity (left/right) is honored when an edit lands exactly at the anchor.
      - Byte, char, grapheme, and screen-cell coordinates are distinct types, not interchanged.

  # --- Vim input profile (F-003 + F-023..F-027) ------------------------------------------------
  # F-003 used to be ONE feature carrying 43 parity IDs — every mode, operator, motion, register and
  # text object at once. Because the requirement was a single blob, the per-mode structure had nowhere
  # to live, and the model beneath it (eight disjoint keymap namespaces, each with its own
  # unmatched-key policy) never became a requirement at all. It is now split along the namespace
  # boundary upstream itself declares (map.txt map-table), governed by spec/parity/contracts/vim-style.yaml.
  # F-003 keeps the router and the mode stack; each namespace is its own deliverable with its own
  # acceptance. IDs are never renumbered, so F-003 stays and the namespaces are appended.  # D-043
  F-003:
    title: Keymap layer router + the Vim profile as its depth-1 configuration
    stage: mvp
    priority: must
    # done (#104 namespaces + #105 layer-owned state + #106 return-address): the keymap layer router
    # (crates/core/src/keymap.rs LayerStack: rank-ordered resolve, sealed-stops-walk, DuplicateRank,
    # collapse) + the Vim profile as eight addressable depth-1 SEALED namespaces (apps/tui/src/input.rs
    # VimProfile), each declaring its census unmatched-key policy (KL-OBL-1/2/3). The five open policies
    # are exercised through the router — insert/replace-selection/overwrite live, append via feed_cmdline,
    # forward/translate declared (#4). Operator-pending is a namespace that ABORTS (#5, PR-1). Layer state
    # is OWNED by its layer and dies with it — NormalState / InsertState, dropped when the layer
    # deactivates, no central reset (KL-OBL-4, #105). Return is a stack with an ADDRESS — i_CTRL-O pushes
    # Suspended{resume:Insert} and the completing command pops it; t_CTRL-\ CTRL-O is the same construct
    # (KL-OBL-5, #106). gv restores an outlived selection (View.last_visual, F-007); mode is per-window
    # (F-007 per-View mode, fed per keystroke) — #6/#7. KL-OBL-6 (collapse==dispatch) is unit-tested in
    # keymap.rs. Deferred (post-MVP, not acceptance): live terminal buffers (t_CTRL-\ CTRL-O flow),
    # Lang-Arg translate re-dispatch (CONCEPT-LANG-ARG blocks F-027), Emacs depth-9 / Helix depth-2 as
    # shipped profiles (the router proves them by test). READY-WITH-SCOPE (C-INPUT/C-EDITLANG concepts
    # pending) — ships done as F-025 did, the parity chain is closed on census map_mode ids.
    status: done
    depends_on: [C-INPUT, C-COMMAND, C-EDITLANG, C-CONFIG]
    summary: >
      Keys resolve against an ORDERED STACK OF KEYMAP LAYERS (D-045). The eight Vim namespaces are that
      stack at depth 1 — sealed, editor-state-selected — each with a declared unmatched-key policy, its
      own owned state, and stack-based return; not one state machine with mode flags.
    trace:
      parity: [nvim.mapmode.norm, nvim.mapmode.opr]   # was VIM-MODE-1/6 — repointed onto the map_mode census (D-043)
      contract: [../spec/parity/contracts/keymap-layers.yaml, ../spec/parity/contracts/vim-style.yaml]
      design: [../docs/design/input-engine.md, ../docs/design/editing-language.md]
      verify: [../tests/parity/vim/namespaces.yaml, ../tests/parity/vim/mode-stack.yaml]
    acceptance:
      - "Resolution walks an ordered layer stack highest-rank-first until a layer binds; a `sealed` layer stops the walk whether or not it bound (KL-OBL-1..3). The Vim profile declares depth 1 and sealed — depth is an OBLIGATION of the profile, not an accident of having one layer active, or `closed/ignore` starts leaking into a lower layer."
      - "The same router at depth 9, unsealed and buffer-selected, resolves an Emacs-style stack, and a depth-2 `[override, base]` resolves a derived mode; neither needs a code path of its own. Build-time collapse of a derived layer is observably identical to consulting it at dispatch (KL-OBL-6)."
      - "Each of the eight namespaces (Norm/Opr/Ins/Cmd/Vis/Sel/Term/Lang) is addressable in its own right; a binding cannot be declared without naming its namespace (VS-OBL-4 = KL-OBL-1)."
      - "Every namespace declares an unmatched-key policy and an `open` namespace never falls through to a shared ignore path (VS-OBL-3). The five open policies (insert/append/overwrite/replace-selection/forward) are each exercised."
      - "Operator-pending is a namespace whose unmatched key ABORTS the pending operator, distinct from Normal's ignore — not a nullable field on Normal state. Layer state is owned by the layer and dies with it; the engine never reaches in to reset it (KL-OBL-4)."
      - "Namespace transitions carry return addresses: `i_CTRL-O` and `t_CTRL-\\ CTRL-O` are the same one-shot-return construct, and `gv` restores a selection that outlived its namespace (VS-OBL-2)."
      - "Mode is per-window/per-buffer: a terminal buffer is in the terminal namespace while a neighbouring window is in normal (VS-OBL-1)."

  # F-023 was split by CENSUS SURFACE (mirrors F-003 -> F-023..F-027 per namespace): operators/motions/
  # dot-repeat live in mode_key.normal (+ operator_pending), text objects in mode_key.text_object, and
  # registers have no clean census surface (a `"` prefix, not a mode_key sub-surface) so they are isolated
  # in F-029 until that home is decided. Rationale: families.yaml FAM-EDIT-VIM-GRAMMAR + D-043 (screen a
  # surface, then repoint trace.parity off the legacy VIM-* ids onto census ids).
  F-023:
    title: Operators, motions & dot-repeat — the Normal editing grammar
    stage: mvp
    priority: must
    # done: operator x count x motion composition (d/c/y + aliases x/X/D/C/Y/s/S, `<<`), the core motions
    # (h l j k 0 $ w W b B e E f F t T ; , G % { }), count multiplication (2d3w), dd/yy doubling->linewise,
    # exclusive->inclusive->linewise promotion, the three operator_pending force keys (v/V/CTRL-V), and
    # dot-repeat (full change incl. inserted text) are all implemented + oracle/unit tested. Carve-outs (NOT
    # F-023 acceptance criteria): the extended g/z operators (gu/gU/g~/gq/g?/g@/zf) and un-implemented
    # `={motion}`/`!`filter/`~{motion}`tildeop/`<{motion}` live on other census sub-surfaces and stay
    # unclassified; search motions belong to F-009; the C-INPUT LANG-ARG re-dispatch and the full C-POSHIST
    # position history (marks/jumplist) are pending-concept carve-outs (READY-WITH-SCOPE), like F-025.
    # Census gap logged: `>>`/`>{motion}` have no upstream-extracted row (only `<<`/`<{motion}` present).
    status: done
    depends_on: [C-INPUT, C-EDITLANG, C-POSHIST]
    summary: Operator x count x motion composition and dot-repeat (census surface mode_key.normal + operator_pending).
    trace:
      # repointed off legacy VIM-OP-*/VIM-MOT-*/VIM-REPEAT-DOT onto the mode_key.normal + operator_pending
      # census (D-043); only implemented+accepted grammar cited (see status carve-outs). vim.md rows retired.
      parity: [nvim.key.normal.x5bx22xx5ddx7bmotionx7d, nvim.key.normal.x5bx22xx5ddd, nvim.key.normal.x5bx22xx5dcx7bmotionx7d, nvim.key.normal.x5bx22xx5dcc, nvim.key.normal.x5bx22xx5dyx7bmotionx7d, nvim.key.normal.x5bx22xx5dyy, nvim.key.normal.x5bx22xx5dx, nvim.key.normal.x5bx22xx5dD, nvim.key.normal.x5bx22xx5dC, nvim.key.normal.x5bx22xx5dY, nvim.key.normal.x5bx22xx5dS, nvim.key.normal.empty, nvim.key.normal.h, nvim.key.normal.l, nvim.key.normal.0, nvim.key.normal.x24, nvim.key.normal.w, nvim.key.normal.W, nvim.key.normal.b, nvim.key.normal.B, nvim.key.normal.e, nvim.key.normal.E, nvim.key.normal.fx7bcharx7d, nvim.key.normal.Fx7bcharx7d, nvim.key.normal.tx7bcharx7d, nvim.key.normal.Tx7bcharx7d, nvim.key.normal.x3b, nvim.key.normal.x2c, nvim.key.normal.G, nvim.key.normal.x25, nvim.key.normal.x7b, nvim.key.normal.x7d, nvim.key.normal.j, nvim.key.normal.k, nvim.key.normal.1, nvim.key.normal.2, nvim.key.normal.3, nvim.key.normal.4, nvim.key.normal.5, nvim.key.normal.6, nvim.key.normal.7, nvim.key.normal.8, nvim.key.normal.9, nvim.key.normal.., nvim.key.operator_pending.v, nvim.key.operator_pending.V, nvim.key.operator_pending.c_V]
      contract: [../spec/parity/contracts/vim-style.yaml]
      design: [../docs/design/editing-language.md, ../docs/design/positions-history.md]
      verify: [../tests/parity/vim/operator-motion.yaml]
    acceptance:
      - "Operator+motion composes with count multiplication (2d3w deletes 6 words) and doubling goes linewise (dd/yy)."
      - "Exclusive->inclusive->linewise motion promotion (VIM-MOT-PROMOTE) matches the vim.md checklist item 1."
      - "The three operator-pending keys of its own (`v`/`V`/`CTRL-V` force charwise/linewise/blockwise) apply to the pending operator; every other unbound key aborts it."
      - "Dot-repeat replays the full change including inserted text."
  F-028:
    title: Text objects — inner/around targets
    stage: mvp
    priority: must
    # done (#95): text objects implemented in apps/tui/src/input.rs (`text_object()` maps
    # iw/aw/i(/a"/it/... to Motions, Vim alias collapse b/B/[/]). Both acceptance criteria are
    # oracle-verified in tests/parity/vim/fixtures/corpus.yaml: operator operand (daw_a_word,
    # diw_inner_word, di(, f(di(), visual extend (viwd_visual_inner_word, viwc_visual_change_text,
    # viwygvd), and inner-vs-around delimiter/whitespace spans. Chain closed (34 census, 0 legacy,
    # READY-WITH-SCOPE). NOTE: trace.verify below names a per-feature file like its siblings
    # (F-023/025/029) — those fixtures live in corpus.yaml today; the per-feature split is a shared
    # symbolic-pointer cleanup, not an F-028 gap.
    status: done
    depends_on: [C-INPUT, C-EDITLANG]
    summary: Text-object targets (iw/aw/i(/a"/it/...) as operator and visual operands (census surface mode_key.text_object).
    trace:
      # repointed off legacy VIM-TOBJ-1..5 onto the mode_key.text_object census (D-043); vim.md rows retired.
      parity: [nvim.key.text_object.aw, nvim.key.text_object.aW, nvim.key.text_object.iw, nvim.key.text_object.iW, nvim.key.text_object.ap, nvim.key.text_object.ip, nvim.key.text_object.as, nvim.key.text_object.is, nvim.key.text_object.at, nvim.key.text_object.it, nvim.key.text_object.ab, nvim.key.text_object.aB, nvim.key.text_object.ib, nvim.key.text_object.iB, nvim.key.text_object.ax28, nvim.key.text_object.ax29, nvim.key.text_object.ix28, nvim.key.text_object.ix29, nvim.key.text_object.ax7b, nvim.key.text_object.ax7d, nvim.key.text_object.ix7b, nvim.key.text_object.ix7d, nvim.key.text_object.ax5b, nvim.key.text_object.ax5d, nvim.key.text_object.ix5b, nvim.key.text_object.ix5d, nvim.key.text_object.a, nvim.key.text_object.i, nvim.key.text_object.ax22, nvim.key.text_object.ix22, nvim.key.text_object.ax27, nvim.key.text_object.ix27, nvim.key.text_object.ax60, nvim.key.text_object.ix60]
      contract: [../spec/parity/contracts/vim-style.yaml]
      design: [../docs/design/editing-language.md]
      verify: [../tests/parity/vim/text-objects.yaml]
    acceptance:
      - "diw / daw / di( / da\" select the inner/around span; usable as an operator operand (diw) and to extend a visual selection."
      - "Inner vs around differ by the surrounding whitespace/delimiters per the vim.md L2 checklist."
  F-029:
    title: Registers / kill-ring — the typed store
    stage: mvp
    priority: must
    # done: the register-select prefix `"{register}` (named a-z, A-Z append), the unnamed and yank-only
    # (`"0`) registers, and put `p`/`P` are implemented; entries carry a SHAPE (charwise/linewise/blockwise)
    # that survives round-trip (dd then p opens a line; blockwise paste per #81) — oracle/unit tested.
    # Census home decided: registers have no dedicated surface, so F-029 anchors on the `"{register}`
    # selection key + p/P within mode_key.normal (the operators that WRITE registers stay under F-023).
    # Carve-outs (NOT F-029 acceptance): numbered ring `"1`-`"9`, small-delete `"-`, black-hole `"_`,
    # expression `"=`, clipboard `"+`/`"*` are not modelled yet; `:registers` awaits the F-026 command engine.
    status: done
    depends_on: [C-EDITLANG, C-REGISTER]
    summary: Named/unnamed/yank-only registers via the `"{register}` prefix + p/P; entries carry a shape that survives round-trip. Census anchor = the `"` selection key (registers are a prefix, not a dedicated surface); numbered ring/black-hole/clipboard are carve-outs.
    trace:
      # repointed off legacy VIM-REG-* onto the mode_key.normal census (D-043): the `"{register}` selection
      # prefix + put p/P. Numbered/other register semantics are documented carve-outs. vim.md rows retired.
      parity: [nvim.key.normal.x22x7bregisterx7d, nvim.key.normal.x5bx22xx5dp, nvim.key.normal.x5bx22xx5dP]
      contract: [../spec/parity/contracts/vim-style.yaml]
      design: [../docs/design/register-model.md]
      verify: [../tests/parity/vim/registers.yaml]
    acceptance:
      - "The unnamed and yank-only (reg 0) registers behave per the L2 checklist; `\"ayy` / `\"ap` address a named register."
      - "Register entries carry a SHAPE (charwise/linewise/blockwise) that survives round-trip (CONCEPT-REGISTER-STORE); dd then p opens a line."

  F-024:
    title: Insert namespace
    stage: mvp
    priority: must
    # done: printable-insert (AC1), i_CTRL-O one-shot return (#79, AC2), i_CTRL-G u undo-break
    # (#79, AC3), and the overwrite policy R (#77) + Virtual Replace gR (#89, tab-aware) with
    # <BS> restore (AC4) are all implemented + oracle-verified (corpus 143/143, 0 divergent).
    status: done
    depends_on: [C-INPUT, C-UNDO]
    summary: The open/insert namespace — a printable key is text — with one-shot return and undo-group ownership.
    trace:
      # Backed by the map_mode census namespace id, exactly as F-025 ships done on
      # nvim.mapmode.vis/sel without enumerating mode_key.visual (D-043 namespace-id backing).
      # Repointed off legacy VIM-MODE-3 + VIM-CNT-INS (#90): both are behaviours INSIDE the Ins
      # namespace, not separate parity surfaces — VIM-MODE-3 (Replace/gR) is the overwrite
      # unmatched-key policy of nvim.mapmode.ins (vim.md frames it exactly so), and VIM-CNT-INS
      # (count-on-insert, 3ihello) is the count grammar applied to Ins entry, deferred (not an
      # F-024 acceptance criterion). C-INPUT carries the CONCEPT-LANG-ARG carve-out (READY-WITH-SCOPE).
      parity: [nvim.mapmode.ins]
      contract: [../spec/parity/contracts/vim-style.yaml]
      design: [../docs/design/input-engine.md, ../docs/design/persistence-and-recovery.md]
      verify: [../tests/parity/vim/insert.yaml]
    acceptance:
      - "An unmatched printable key inserts literally; the control-key table is the exception, not the default path."
      - "`CTRL-O` runs exactly one Normal command and resumes Insert at the same position (the shared one-shot-return construct)."
      - "The namespace owns undo-grouping intent: `CTRL-G u` starts a new undoable edit mid-insert."
      - "Replace / Virtual Replace (`R`/`gR`) use the overwrite policy and `<BS>` restores the original character."

  F-025:
    title: Visual + Select namespaces
    stage: mvp
    priority: must
