  F-010:
    title: Terminal capability detection
    stage: mvp
    priority: must   # promoted: F-006 (must) depends on the capability ledger (V-18)
    # done (#92): apps/tui/src/caps/ — a DA1-fenced probe (probe.rs: query_batch ends with the DA1
    # fence, ProbeParser stops at it, no per-cap timeout) feeding the {value,source,confidence}
    # ledger (ledger.rs: Source precedence Default<EnvHint<Probed<UserOverride, override always
