# Parity-coverage backlog — the tracked debt of targeted parity items (L1/L2, not
# Unsupported/Intentionally-different) that the PRD does NOT yet derive via trace.parity.
# Enforced by `gov parity_coverage` (D-007). This ledger makes the debt visible and blocks NEW
# drift: a targeted parity item must be covered by the PRD or listed here. **Burn this down** —
# move an item into a PRD feature's trace.parity (and add any config-schema keys it implies),
# then delete its line here. Goal: this list trends to zero.
version: 1
