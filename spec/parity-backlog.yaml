  - { id: TERM-WIDTH-2, feature: F-002, reason: "grapheme/cell width — implemented (unicode-width), but width is ruse coordinate architecture with no upstream census surface" }
  - { id: TERM-WIDTH-3, feature: F-002, reason: "wide/emoji/combining width — implemented (unicode-segmentation+width); no enumerable upstream census surface" }
  - { id: NVIM-EXT-1, feature: F-002, reason: "extmark/decoration anchors — the anchor model (anchor.rs Bias) is ruse architecture; nvim extmarks are an API, not a source-tree census surface" }
  - { id: NVIM-EXT-3, feature: F-002, reason: "extmark gravity/positioning — modelled by anchor.rs; no census surface (nvim extmark API)" }
  - { id: NVIM-EXT-4, feature: F-002, reason: "extmark survive-edits semantics — anchor update rule; no census surface" }
