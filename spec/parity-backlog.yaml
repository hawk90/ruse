# Parity-coverage backlog — the tracked debt of targeted parity items (L1/L2, not
# Unsupported/Intentionally-different) that the PRD does NOT yet derive via trace.parity.
# Enforced by `gov parity_coverage` (D-007). This ledger makes the debt visible and blocks NEW
# drift: a targeted parity item must be covered by the PRD or listed here. **Burn this down** —
# move an item into a PRD feature's trace.parity (and add any config-schema keys it implies),
# then delete its line here. Goal: this list trends to zero.
version: 1
backlog:
  # F-010 terminal capabilities with NO DA1-probe census home (#91, D-043). The two neovim TUI census
  # surfaces (term_mode, key_encoding) carry the DECRQM-probed + keyboard-encoding facts; these six are
  # real parity items evidenced OUTSIDE that probe surface, so they are tracked debt, not silently
  # dropped. Burn down by giving each a census surface (or a ruse-choice PILLAR) and repointing F-010.
  - { id: TERM-PROBE-2,  feature: F-010, reason: "confidence ledger + user override — ruse-ADAPTED (F-010 acceptance #2), a ruse-choice with no upstream denominator; belongs in a PILLAR, not a FAM parity fact" }
  - { id: TERM-PROBE-3,  feature: F-010, reason: "tmux/screen passthrough (L2) — DCS-wrapping, not a DECRQM mode; needs a multiplexer census surface" }
  - { id: TERM-MOUSE-2,  feature: F-010, reason: "focus reporting (mode 1004) — neovim SETS it but never DA1-queries it, so it is absent from the TermMode probe enum" }
  - { id: TERM-GFX-4,    feature: F-010, reason: "pixel<->cell sizing (CSI 14 t / CSI 16 t) — a window-op query, not a DEC private mode; low priority" }
  - { id: TERM-OSC52-1,  feature: F-010, reason: "clipboard write over OSC 52 — a runtime clipboard provider concern (runtime/lua in neovim), not a TUI capability probe" }
  # F-008 file/persistence facts with no census SURFACE (#93, D-043). Durable-atomic-save + recovery
  # journal are ruse persistence ARCHITECTURE (C-PERSIST, docs/design/persistence-and-recovery.md);
  # no editor source tree enumerates them as a table. Burn down via a persistence census surface or a
  # ruse-choice PILLAR. Encoding/line-endings is separately covered by config editor.line_endings (D-042).
  - { id: COM-1,  feature: F-008, reason: "open/save/reload files — a cross-editor capability, not an enumerable census surface; the save ENGINE is ruse architecture, the :w/:e command grammar is F-026/ex_command" }
  - { id: COM-9,  feature: F-008, reason: "session recovery (Adapted) — ruse's append-only recovery journal is an ADAPTATION with no upstream denominator" }
  - { id: COM-12, feature: F-008, reason: "large files (Adapted) — a performance/behaviour policy, not a tabulated upstream fact" }
  - { id: COM-13, feature: F-008, reason: "encoding / line-endings — the CAPABILITY derives via config editor.line_endings (D-042 <- nvim.opt.fileformat/fileencoding); the legacy row is tracked until that config->census link is made explicit" }
  # F-005 undo model (#96, D-043) — ruse kernel ARCHITECTURE (C-UNDO/C-TRANSACTION), no upstream
  # SURFACE tabulates it. COM-7/VIM-UNDO-1/EMACS-EDIT-1 stay derived via F-001; COM-8 is F-005-only.
  - { id: COM-8,  feature: F-005, reason: "undo TREE (branching history) — implemented in undo.rs, but the branching-undo MODEL is ruse architecture with no enumerable upstream census surface; the catalog row is tracked debt until a persistence/history PILLAR is written" }
  # F-026 (#97): VIM-MODE-8 Ex mode is entered by gQ only (Q is replay-last-register at the pin) and is
  # "Adapted" — it is NOT one of the 8 map_mode namespaces, so it has no census home. gQ entry + reprompt
  # is implemented; the full Ex-mode UX (q:/wildmenu/incsearch/history) is deferred.
  - { id: VIM-MODE-8, feature: F-026, reason: "Ex mode (gQ) — Adapted, not a map_mode census namespace; entry+reprompt shipped, full Ex UX deferred" }
  # F-002 coordinate/anchor model (#98, D-043) — ruse KERNEL ARCHITECTURE (C-DOCUMENT/C-ANCHOR).
  # extmarks (nvim API), markers (emacs runtime), and grapheme/cell width are cross-editor coordinate
