  - { id: NVIM-EXT-7, feature: F-002, reason: "extmark namespace/lifetime — anchor policy; no census surface" }
  - { id: EMACS-EDIT-2, feature: F-002, reason: "Emacs markers (position objects surviving edits) — the ruse anchor is the counterpart; markers are emacs runtime, not an enumerable census surface" }
