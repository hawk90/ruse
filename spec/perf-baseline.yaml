# Benchmark baseline — the committed record of what each `[[bench]]` measures, so a perf CLAIM is
# checkable against a number instead of asserted (the "measure before claiming" lesson, D-019).
#
# Numbers are one dev machine's (see `machine`) — RELATIVE, not a budget (D-019: budgets live in
# ci-cd-and-release.md §10). Regenerate with `ruse bench` after a perf-relevant change. `gov perf` gates
# that every registered bench appears here (deterministic, no bench run); a nightly CI compares a live
# run to these with a generous threshold (D-019 trend+warn on a fixed machine).
#
# `p50` values are criterion's central estimate at the recorded date; keep the headline cases, not every
# data point. Adding a `[[bench]]` without an entry here FAILS `gov perf` — record its numbers.

version: 1
machine: "darwin / arm64 dev laptop (relative baseline, not a budget)"
recorded: "2026-08-11"

benches:
  # crates/core
  edit_apply:                       # #1 per-edit buffer cost — O(n) flat Arc<Vec<u8>>; single copy (apply_to)
                                    # after dropping the second element-wise Arc<[u8]>::from copy (2026-08-18)
    edit_apply/100: "657 ns"
    edit_apply/1000: "8.8 us"       # was 14.4us (Arc<[u8]> double-copy); Arc<Vec<u8>> move -> -42%
    edit_apply/10000: "15.2 us"     # was 26us -> -37%
    edit_apply/100000: "92 us"      # was 1.18ms -> -92% (element-wise Arc<[u8]>::from was the cost)
  anchor_apply:                     # #686/#1122 per-edit anchor cost. DEV-PROFILE numbers (2026-11-03, no
                                    # release build on that run): regenerate with `ruse bench`. Store before
                                    # (sort per edit): 1000 43us, 100000 4.2ms, 400000 16.8ms, same profile.
    anchor_apply/store/1000: "1.1 us"
    anchor_apply/store/100000: "2.1 us"
    anchor_apply/store/400000: "2.5 us"
    anchor_apply/g_normal/1000: "179 us"
    anchor_apply/g_normal/100000: "289 us"
  line_math:                        # the O(buffer) pos:: scan the LineIndex replaces on the hot path
    line_of_end/1000: "6.6 us"
    line_of_end/10000: "61 us"
    line_of_end/100000: "623 us"
    nth_line_start_last/100000: "2.13 ms"
  long_line:                        # #1109 two 1 MB Hangul lines: one screen-column walk per command (was
                                    # quadratic: one `j` did not finish in minutes). Recorded 2026-11-03.
    long_line/dollar: "330 us"
    long_line/j_k_at_end: "35 ms"
    long_line/visual_block_yank: "69 ms"
  word_search:                      # #745 `*`/`#`/hlsearch: compile + scan of `\<word\>` over mixed Latin/Hangul/
                                    # CJK lines, edges checked with Vim's classes. DEV-PROFILE (2026-11-03, no
                                    # release build). Before (Unicode \b{start}/\b{end} in the engine), same
                                    # profile: latin/10000 357 ms, hangul/10000 431 ms.
    word_search/latin/1000: "3.3 ms"
    word_search/hangul/1000: "4.5 ms"
    word_search/latin/10000: "32 ms"
    word_search/hangul/10000: "31 ms"

  # apps/tui
  highlight_parse:                  # #2 syntax cost — full reparse vs incremental+viewport (F-015 #3)
    highlight_parse/1000: "8 ms"
    highlight_parse/10000: "77 ms"
    highlight_incremental/1000: "1.2 ms"
    highlight_incremental/10000: "10 ms"
    search_hl/full_buffer/1000: "37 us"
    search_hl/full_buffer/100000: "3.35 ms"
    search_hl/cached_hit/1000: "4.3 ns"
    search_hl/cached_miss/100000: "2.3 us"
  count_insert:                     # #1123 `{N}ix<Esc>` on the headless key path. DEV-PROFILE (2026-11-03, no
                                    # release build). Before (one edit per repeated char), same profile:
                                    # 10000 1.9 s, 20000 7.4 s, 40000 30 s (quadratic).
                                    # Repeats spliced in doubling chunks capped at 64 KiB.
    count_insert/10000: "1.48 ms"
    count_insert/100000: "11.8 ms"
    count_insert/1000000: "367 ms"
  journal_replay:                   # RFC-0023 slice 2: the open-time recovery scan (read + replay, as
                                    # Journals::offer) against the contract's recovery_scan_p95_ms: 500.
                                    # Release build, 2026-11-05; p95 of 20 samples: 5.83 ms and 101 ms. The
                                    # 33 MiB case is mostly the SHA-256 of the disk text.
    journal_replay/checkpoint_1MiB_10000_edits: "5.79 ms"
    journal_replay/disk_base_33MiB_1000_edits: "100.6 ms"
  input_dispatch:                   # keystroke dispatch (feed) — human-rate, never per frame
    input_feed_sequence: "1.34 us"
  line_index:                       # D-042 win D — cached line lookups vs the O(n) line_math scan
    line_of_end/100000: "12.6 ns"
    nth_line_start_last/100000: "0.32 ns"
    refresh/100000: "1.32 ms"
