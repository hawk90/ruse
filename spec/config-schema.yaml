# Config schema — the machine-managed, authored source of truth for every CORE setting (C-CONFIG).
# Prose model + rationale: ../docs/design/config-model.md. Requirements: ../docs/architecture/design-requirements.md#10 (CFG).
# This file drives autocomplete, type-check, deprecation warnings, and migration — no manual upkeep elsewhere.
# A generator (D-021/D-022) may emit a JSON copy for editor tooling; THIS YAML is canonical and hand-edited.
#
# `scopes:` declares the three layers and their precedence (low -> high). Some keys are security-locked so a
# workspace layer can NEVER contribute them, regardless of workspace trust (CFG-LOCK-001; enforces INV-TRUST-1).
#
# `settings:` is an ID-keyed map (dotted namespaced key). Each entry is a record with fields:
#   type            bool | int | string | enum | list | map          (required)
#   default         the schema-default value (layer 0)               (required)
#   scope           user | workspace | machine  = BROADEST layer allowed to write it (required)
#                     machine  -> only machine-local may set it (user/workspace inert)
#                     user     -> machine or user may set it (workspace inert)
#                     workspace-> any layer may set it
#   merge           replace | append | set-union | deep-merge  = how layers fold (required)
#                     replace   -> higher layer wins (scalars)
#                     append    -> concatenate low->high, keep order+dups (lists)
#                     set-union -> union + de-dup (sets)
#                     deep-merge-> recurse per key, leaves resolve by their own strategy (maps)
#   security_locked bool = workspace can NEVER override (executables/trust/forwarding). Default false.
#   enum            [..]  = allowed values (required iff type=enum)
#   min / max       int bounds (optional, type=int)
#   secret          bool = never logged / redacted in `:inspect config`. Default false. (optional)
#   deprecated      bool + optional replaced_by (alias for a deprecation window). Default false. (optional)
#   derives_from    [F-..] = the PRD feature(s) this setting realizes (the PRD->CFG trace). REQUIRED on every
#                     key; `[]` is a legal, explicit "no owning feature yet" (surfaced as WARN, never a fail).
#                     F-ids must resolve to real PRD features. Enforced by `gov prd_cfg`.
#   desc            one-line description                                (required)
#
# LLM rules: patch a single key; never rename a key (add new + mark old deprecated); never renumber `version`
# without a matching migration entry; loosening `security_locked`/`scope` is a security-relevant breaking change.

version: 1

scopes:
  # precedence low -> high; for a `replace` key the highest layer ALLOWED to write it wins (per-key, not per-file).
  machine:   { precedence: 1, location: "system/admin (/etc/ruse, install dir)", trust: core, note: "admin baseline; may PIN security_locked / scope:machine keys above user+workspace (enterprise lock)" }
  user:      { precedence: 2, location: "~/.config/ruse", trust: user, note: "per-user preferences" }
  workspace: { precedence: 3, location: ".ruse/ in workspace root", trust: workspace, note: "project settings; INERT until the workspace is trusted; security_locked keys are always dropped here" }
  # Security note: security_locked=true keys and keys whose `scope` is narrower than a given layer are dropped
  # from that layer BEFORE merge, with a config.locked_key_ignored / scope diagnostic (CFG-LOCK-001).

settings:
  # ---- input ----
  input.profile:        { type: enum,   default: vim,    scope: user,      merge: replace,   security_locked: false, enum: [vim, emacs, native], derives_from: [F-003, F-012, F-013], desc: "Active input profile (editing language + state machine, architecture section 1)." }

  # ---- keymap (one LAYER per Vim keymap namespace; D-045 / contracts/keymap-layers.yaml) ----
  # Under D-045 these eight keys are the Vim profile's LAYER OVERLAYS, not the kernel's layer model.
  # They keep their names and shape deliberately: an Emacs profile adds its own keys for its own
  # layers rather than renaming or generalising these, because a key that means "the active layer,
  # whatever it is" would re-create exactly the unqualified binding KL-OBL-1 forbids.
  # Upstream's own map.txt map-table declares EIGHT disjoint keymap namespaces, each addressed by its
  # own `:*map` family — that is why these are eight keys and not one `keymap` map with a mode field:
  # a binding that does not name its namespace is not expressible (VS-OBL-4). Merge is deep-merge so a
  # layer can override ONE binding without replacing a whole namespace; the built-in profile bindings
  # are not defaults here (they belong to the profile), so each default is the empty overlay.
  # scope:user, not workspace: a binding invokes a command, so a workspace-supplied keymap is a
  # remote-code-execution-shaped surface. Relaxing this to workspace needs its own Decision.
  keymap.normal:           { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-003], desc: "Normal-namespace bindings (map_mode Norm). Unmatched key: ignore." }
  keymap.operator_pending: { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-023], desc: "Operator-pending-namespace bindings (map_mode Opr). Unmatched key: abort the pending operator." }
  keymap.insert:           { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-024], desc: "Insert-namespace bindings (map_mode Ins). Unmatched printable key: insert literally." }
  keymap.cmdline:          { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-026], desc: "Command-line-namespace bindings (map_mode Cmd). Unmatched printable key: append to the line buffer." }
  keymap.visual:           { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-025], desc: "Visual-namespace bindings (map_mode Vis). Unmatched key: ignore." }
  keymap.select:           { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-025], desc: "Select-namespace bindings (map_mode Sel). Unmatched printable key: replace the selection and enter Insert." }
  keymap.terminal:         { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-011], desc: "Terminal-namespace bindings (map_mode Term). Unmatched key: forward to the job, except the CTRL-\\ escape prefix." }
  keymap.lang:             { type: map, default: {}, scope: user, merge: deep-merge, security_locked: false, derives_from: [F-027], desc: "Lang-Arg-namespace bindings (map_mode Lang). The persistent form of the `:lmap` map read by the pre-dispatch translation stage (D-048); no config-file loader is built yet (no keymap.* key is runtime-loaded)." }

  # ---- editor ----
  editor.tab_width:     { type: int,    default: 4,      scope: workspace, merge: replace,   security_locked: false, min: 1, max: 16, derives_from: [], desc: Number of columns a tab renders/indents as. }
  editor.indent_style:  { type: enum,   default: space,  scope: workspace, merge: replace,   security_locked: false, enum: [space, tab], derives_from: [], desc: Whether indentation uses spaces or tabs. }
  editor.line_endings:  { type: enum,   default: auto,   scope: workspace, merge: replace,   security_locked: false, enum: [lf, crlf, auto], derives_from: [F-008], desc: "Line-ending policy on save (auto = preserve/detect per file). Only `auto` is wired today (F-008 detects+preserves per file); the `lf`/`crlf` force values have no consumer yet." }
  editor.scrolloff:     { type: int,    default: 3,      scope: user,      merge: replace,   security_locked: false, min: 0, max: 99, derives_from: [], desc: "Minimum lines of context kept above/below the cursor when scrolling (Vim scrolloff). Derived from the shipped viewport behavior; not yet runtime-wired." }
  editor.textwidth:     { type: int,    default: 0,      scope: workspace, merge: replace,   security_locked: false, min: 0, max: 999, derives_from: [F-023], desc: "Maximum line width the gq/gw reformat operators wrap to (Vim textwidth); 0 means use the fallback of 79 columns. Runtime-set via :set textwidth/tw." }
  # Search-case (F-009). ruse ships these ON (better-than-Vim: the most widely recommended vimrc pair; Vim's
  # OFF default is script backwards-compat, which ruse has no legacy of). The shipped default is applied at
  # the Workspace level by the frontend; the ENGINE default stays OFF so the differential parity oracle keeps
  # driving `EditorState` at the Vim factory setting. Runtime-set via `:set ignorecase/ic`, `:set smartcase/
  # scs` (and `no`-prefix); no config-file loader reads the persistent keys yet.
  editor.ignorecase:    { type: bool,   default: true,   scope: user,      merge: replace,   security_locked: false, derives_from: [F-009], desc: "Case-insensitive search (Vim ignorecase/ic). Shipped ON (Vim defaults off); engine default stays off for the parity oracle. Runtime-set via :set ic; no config-file loader yet." }
  editor.smartcase:     { type: bool,   default: true,   scope: user,      merge: replace,   security_locked: false, derives_from: [F-009], desc: "With ignorecase, a pattern containing an uppercase char searches case-sensitively (Vim smartcase/scs). Shipped ON with ignorecase. Runtime-set via :set scs; no config-file loader yet." }
  editor.hlsearch:      { type: bool,   default: true,   scope: user,      merge: replace,   security_locked: false, derives_from: [F-009], desc: "Highlight all matches of the last search until :noh (Vim hlsearch/hls). ON by default (better-than-Vim; matches are viewport-cached). Runtime-toggled via :set hls; no config-file loader yet." }
  editor.incsearch:     { type: bool,   default: true,   scope: user,      merge: replace,   security_locked: false, derives_from: [F-009], desc: "Highlight the pattern being typed while entering /..? (Vim incsearch/is). ON by default (matches Neovim). Runtime-toggled via :set is; no config-file loader yet." }

  # ---- render (in-buffer rendering; F-031) ----
  render.conceal:       { type: bool,   default: true,   scope: user,      merge: replace,   security_locked: false, derives_from: [F-031], desc: "Conceal marked-up byte ranges (e.g. Markdown heading prefixes), revealed on the caret line. Overridable at runtime by RUSE_CONCEAL=off; the config-file key has no loader yet." }

  # ---- files ----
  # NOTE: files.* keys are declared but NOT yet runtime-wired — no config loader reads them, and the tree/
  # picker exclusion currently uses .gitignore rather than files.exclude. Wiring is a follow-up.
  files.watcher:        { type: enum,   default: native, scope: workspace, merge: replace,   security_locked: false, enum: [native, poll, off], derives_from: [], desc: "File-watch backend (native OS events, polling fallback, or disabled). Not yet runtime-wired: no watcher backend exists yet." }
  files.exclude:        { type: list,   default: [".git", "node_modules", "target"], scope: workspace, merge: append, security_locked: false, derives_from: [], desc: "Glob patterns hidden from tree/search/watch; layers append (use !pattern to remove). Not yet runtime-wired: exclusion currently reads .gitignore, not this key." }

  # ---- ui ----
  ui.theme:             { type: string, default: default, scope: user,     merge: replace,   security_locked: false, derives_from: [], desc: "Active color theme name. Not yet runtime-wired: no theme loader exists yet." }

  # ---- update ----
  update.channel:       { type: enum,   default: stable, scope: user,      merge: replace,   security_locked: false, enum: [stable, beta, nightly], derives_from: [], desc: "Release channel used for self-update checks. Not yet runtime-wired: no self-update mechanism exists yet." }

  # ---- remote (security-sensitive: trust) ----
  remote.trust_prompt:  { type: bool,   default: true,   scope: user,      merge: replace,   security_locked: true,  derives_from: [F-017], desc: "Prompt before trusting a remote runtime/workspace. Workspace can NEVER override (INV-TRUST-1). Not yet runtime-wired (F-017 remote runtime still planned)." }

  # ---- plugins (security-sensitive: executables/trust) ----
  plugins.allow_unsigned: { type: bool, default: false,  scope: machine,   merge: replace,   security_locked: true,  derives_from: [F-016], desc: "Allow loading unsigned/unverified plugins. Admin-only; workspace can NEVER override (INV-TRUST-1). Not yet runtime-wired (F-016 plugin loader still planned)." }

  # ---- telemetry ----
  telemetry.enabled:    { type: bool,   default: false,  scope: user,      merge: replace,   security_locked: false, derives_from: [], desc: "Opt-in anonymous telemetry (off by default). Not yet runtime-wired: no telemetry pipeline exists yet." }

# Per-plugin settings are NOT listed here: a plugin declares its own schema (same field set) namespaced under
# `plugin.<plugin-id>.*` in its manifest (architecture #4.5 / config-model.md CFG-PLUGIN). A plugin may only
# declare keys in its own namespace and may NOT mark a core key security_locked or un-lock one.
