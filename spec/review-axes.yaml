# Review Axes — ruse's inspection rubric (the durable form of the "검사 축" catalog).
#
# WHAT THIS IS: a machine-checkable catalog of the dimensions a review of ruse should cover. It captures the
# *questions* (definitions), not the *answers*. A point-in-time assessment of these axes lives in a dated
# report under docs/reviews/ (one fact, one home) — never inline here.
#
# METHOD (how an axis is assessed — be honest about enforcement, per RA-RUSE-001):
#   machine = a tool/test/CI gate can decide it        llm    = an LLM rubric can assess it from the repo
#   manual  = needs human judgement                    mixed  = partly automatable, partly judgement
# TIER (review priority):
#   P0 = ruse-critical, check first (the RUSE domain)  P1 = core correctness/architecture
#   P2 = quality                                       P3 = long-horizon / polish
#
# Each domain sets default_method/default_tier; an axis overrides with its own `method:`/`tier:` when needed.
# IDs are stable: RA-<DOMAIN>-NNN. Never rename or renumber an id (RA-LLM-013). `refs:` cross-link related
# axes; `q:` (RUSE only) is the sharpened assessment question. Adding an axis = one line. This catalog is
# itself validated by `spec-validate` (dogfood: the review system reviews itself).
#
# Run:  python3 tools/review_axes.py --stats | --list --tier P0 | --json
version: 1

methods: [machine, llm, manual, mixed]
tiers:
  P0: ruse-critical — check first
  P1: core correctness / architecture
  P2: quality
  P3: long-horizon / polish

domains:
  # ============================================================================================
  - id: RUSE
    title: "Ruse-critical cross-cutting priorities (check first)"
    default_tier: P0
    default_method: mixed
    axes:
      - { id: RA-RUSE-001, title: "Spec vs enforcement gap", method: mixed, refs: [RA-ARCH-037, RA-DOC-018], q: "For every normative rule (POLICY/INV/DECISION), is there a machine gate or test? Enumerate prose-only rules — those are unenforced." }
      - { id: RA-RUSE-002, title: "Current vs target-state drift", method: mixed, refs: [RA-ARCH-039, RA-LLM-012], q: "Does every doc/spec distinguish 'is' from 'will be', and does code match the 'is'? List claims true only of the target." }
      - { id: RA-RUSE-003, title: "Management overhead vs product-implementation ratio", method: manual, refs: [RA-PM-029, RA-PM-028], q: "Is the ceremony (specs, workflows, gates) justified by product code shipped? Flag process that outweighs implementation." }
      - { id: RA-RUSE-004, title: "First vertical slice validates the architecture", method: manual, refs: [RA-ARCH-004, RA-STATE-008, RA-INPUT-001], q: "Can one end-to-end slice (keypress → transaction → document → render) prove the layering before breadth is built?" }
      - { id: RA-RUSE-005, title: "LLM context completeness · minimality · freshness", method: mixed, refs: [RA-LLM-003, RA-LLM-004, RA-LLM-018], q: "Does the generated agent context carry exactly what's needed, no more, and is it provably current (source hash)?" }
      - { id: RA-RUSE-006, title: "CI == local verification (single entry point)", method: machine, refs: [RA-CICD-001, RA-CICD-002], q: "Does one command reproduce CETL locally, and does CI run that same command — no drift between the two?" }
      - { id: RA-RUSE-007, title: "State / authority / process / trust boundaries are explicit", method: llm, refs: [RA-ARCH-009, RA-ARCH-010, RA-ARCH-011, RA-ARCH-012], q: "For each boundary: who owns the state, which process runs it, what is trusted across it? Any implicit boundary is a bug." }
      - { id: RA-RUSE-008, title: "Command–Transaction–Document–Render path integrity", method: llm, refs: [RA-INPUT-001, RA-STATE-008, RA-RENDER-001], q: "Is the core path single, deterministic, and the only way to mutate? Any bypass (direct edit, side-channel render) breaks it." }
      - { id: RA-RUSE-009, title: "Plugin & remote fault + security isolation", method: llm, refs: [RA-PLUGIN-007, RA-REMOTE-025, RA-SEC-012], q: "Can a plugin crash/hang or a remote failure never corrupt core state or leak trust? Prove the blast radius is bounded." }
      - { id: RA-RUSE-010, title: "Requirement → design → code → test traceability", method: mixed, refs: [RA-ARCH-003, RA-TEST-030], q: "Can every requirement be traced to a design, an implementation, and a test — and back? Enumerate breaks in the chain." }

