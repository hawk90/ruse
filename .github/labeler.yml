# Auto-applies area labels to PRs by changed path. Advisory only — humans may correct. No type/* rules: a path
# does not tell the change type (a feature PR that amends an RFC is not an RFC).
'area/core':   [{ changed-files: [{ any-glob-to-any-file: 'crates/core/**' }] }]
'area/render': [{ changed-files: [{ any-glob-to-any-file: 'crates/render-model/**' }] }]
'area/terminal': [{ changed-files: [{ any-glob-to-any-file: 'crates/terminal-platform/**' }] }]
'area/remote': [{ changed-files: [{ any-glob-to-any-file: ['crates/workspace-runtime/**', 'apps/remote-agent/**'] }] }]
'area/plugin': [{ changed-files: [{ any-glob-to-any-file: 'crates/plugin-protocol/**' }] }]
'area/infra':  [{ changed-files: [{ any-glob-to-any-file: ['.github/**', 'tools/**'] }] }]
'area/docs':   [{ changed-files: [{ any-glob-to-any-file: ['docs/**', 'spec/**'] }] }]
