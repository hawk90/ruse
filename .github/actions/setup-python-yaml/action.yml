name: setup-python-yaml
description: >-
  Python 3.12 with PyYAML, the interpreter and the one package every spec /
  governance tool under tools/ needs. One place to bump either.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15.1'
    - run: pip install pyyaml==6.0.3
      shell: bash
