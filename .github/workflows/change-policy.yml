# Server-side merge gate (RA-RUSE-006). The GATE OF RECORD lives HERE, not on the contributor's machine:
# CI re-derives the observed change-kind + blast radius from the real PR diff, and the verify steps are
# re-run from scratch by spec-check.yml (required jobs). The author's DECLARED contract is read from the
# `ruse-gate:v1` block that `ruse pr render` embeds in the PR body — untrusted input, cross-checked against
# the diff. `.ruse/` (local evidence.json / change.yaml) is gitignored ON PURPOSE and never trusted here:
# a self-reported "tests passed" file cannot be the gate. See docs/operations/change-workflow.md.
# The gate's own CODE and POLICY (tools/, spec/change-kinds.yaml) are taken from the BASE branch, not the
# PR: otherwise a PR could edit pr_check.py or the kind table to wave itself through. A PR that changes
# the gate is therefore judged by the gate it is replacing; the new gate applies from the next PR.
name: change-policy
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                   # need the base ref to diff the PR
      - uses: ./.github/actions/setup-python-yaml
      - name: Use the base branch's gate code + policy (the PR cannot grade itself)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -rf tools
          git checkout "origin/$BASE_REF" -- tools spec/change-kinds.yaml
      - name: Read the author-declared gate block from the PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr view "${{ github.event.pull_request.number }}" --json body -q .body > /tmp/pr-body.md
      - name: Change-policy gate (classify + artifacts + blast radius, re-derived from the diff)
        run: >
          python3 tools/ruse.py pr check --pr-body /tmp/pr-body.md
          --base "origin/${{ github.base_ref }}"
          --actor "${{ github.event.pull_request.user.login }}"
