# Doc-system integrity (runnable today). Blocks dangling refs / layer violations / broken links /
# bad enums / dup IDs across spec/ + docs/. See docs/operations/spec-validate.md. Also lints .github/workflows.
name: spec-check
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  spec-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-yaml
      - run: python3 tools/spec-validate.py
      # When the generator (D-022) exists: python3 tools/spec-build.py && git diff --exit-code
      - name: docs hygiene (anchors / frontmatter / normative leak)
        run: python3 tools/ruse.py docs check
      - name: change-workflow toolchain tests
        run: python3 -m unittest discover -s tools/tests -t .
      # Workflow files are code too: an invalid expression fails the run before any step executes
      # (perf.yml failed 35/35 nightly runs that way unnoticed). shellcheck off — inline scripts are tiny.
      - name: workflow lint (actionlint 1.7.12)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -shellcheck=
