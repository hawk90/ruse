# Rust CI: fmt · clippy (-D warnings) · test · dependency-direction check.
# `rust` (ubuntu) is a REQUIRED check, so it never uses a workflow-level paths filter (a skipped required
# check deadlocks the PR). Instead it always runs and, on a PR, skips the heavy steps itself when no
# Rust-relevant path changed — the skip still reports success.
# `rust-macos` is advisory (not required): clippy + test on macOS, because platform-specific code
# (pty/forkpty, terminal) can be clean on Linux and broken on macOS. Same Rust-relevance gate.
# Security (docs/operations/ci-cd-and-release.md §11): actions pinned by SHA, least-privilege token.
name: ci
on:
  pull_request:
  push: { branches: [main, next] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                   # need the base ref to diff a PR
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          have=0; [ -f Cargo.toml ] && have=1
          echo "have=$have" >> "$GITHUB_OUTPUT"
          # PRs: run the heavy Rust steps only when Rust-relevant paths moved. Fail SAFE — if the diff
          # cannot be computed, run them. Other events always run.
          rust=1
          if [ "$EVENT" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null; then
              if git diff --name-only FETCH_HEAD HEAD 2>/dev/null \
                   | grep -qE '^(crates|apps|tests)/|Cargo\.(toml|lock)$|^rust-toolchain|^\.github/workflows/ci\.yml$|^spec/(architecture|dependencies)\.yaml$'; then
                rust=1
              else
                rust=0
              fi
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.rust == '0'
        run: echo "No Rust-relevant change in this PR — cargo/arch steps skipped (still green)."
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with: { components: "rustfmt, clippy", cache: false, build-warnings: allow }
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 — caches ~/.cargo + target/ keyed on Cargo.lock
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        run: cargo fmt --all --check
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        run: cargo test --workspace
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        run: pip install pyyaml
      - name: dependency direction + cycle check
        if: steps.detect.outputs.have == '1' && steps.detect.outputs.rust == '1'
        run: python3 tools/ruse.py arch deps

  rust-macos:
    needs: rust
    if: needs.rust.outputs.rust == '1'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with: { components: clippy, cache: false, build-warnings: allow }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
