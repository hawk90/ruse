# Path-based auto area labels (advisory). Uses .github/labeler.yml.
name: labeler
on: { pull_request_target: { types: [opened, synchronize, reopened] } }
permissions: { contents: read, pull-requests: write }
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5           # TODO pin SHA
        with: { sync-labels: false }
