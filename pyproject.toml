# ruse — Python tooling package (the Repository Governance Plane engine).
#
# Scope: declares the runtime dependency (PyYAML) and standard dev-tool config so a contributor gets
# `pip install -e .`, `pytest`, `ruff`, and `mypy` with zero setup. The former sibling packages
# (change / verify / ai / arch / docs / gov) are now folded under `rusekit.*` — the 17 `sys.path` shims are
# gone. Every runtime entry (tools/ruse.py, tools/spec-validate.py, tools/lint-commit-msg.py) is a top-level
# script, so `import rusekit` resolves via the auto-added script dir; deep helpers are reached through
# `ruse <cmd>` (e.g. lefthook/CI run `ruse docs check`, not `tools/docs/check.py`).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruse-tools"
version = "0.0.0"
description = "ruse Repository Governance Plane — spec-first change workflow + governance checkers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]
include = ["rusekit*"]          # rusekit + change/gov/verify/ai/arch/docs, now all folded under rusekit.*

[tool.pytest.ini_options]
pythonpath = ["tools"]          # resolve `from rusekit import …` (and siblings) without the runtime shim
testpaths = ["tools/tests"]

[tool.ruff]
line-length = 100
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]               # long spec-reference lines are intentional

[tool.mypy]
python_version = "3.10"
files = ["tools/rusekit"]
ignore_missing_imports = true
