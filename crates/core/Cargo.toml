[package]
name = "ruse-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# F-002: cursor/coordinate resolution over user-perceived characters. `unicode-segmentation` gives
# UAX#29 extended grapheme clusters (so the cursor never lands mid-emoji/ZWJ/combining sequence);
# `unicode-width` gives East-Asian/wide/zero cell widths. This deliberately relaxes the previously
# dep-free-core rule (decided 2026-08-10): a correct coordinate model needs the Unicode tables, and
# hand-rolling UAX#29 + wcwidth would be a larger, worse liability. Both are data-only, no_std-capable.
unicode-segmentation = "1"
unicode-width = "0.2"
# F-009 / DEP-REGEX (D-028): the DEFAULT regex engine behind the C-REGEX abstraction — linear-time,
# ReDoS-immune. The Vim-dialect front-end (pattern.rs) lowers a magic-resolved pattern onto it; the
# crate's types never reach ruse's public API (public_api_exposure: none). The owned NFA engine for
# lookbehind/backrefs/full-\zs is post-MVP; MVP uses this one alone (scope decided 2026-08-11).
regex = "1"

[dev-dependencies]
# Benchmarking harness (D-042). Lean features: keep cargo-bench integration, drop rayon + plotters/gnuplot.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Property-based testing of the semantic invariants (testing §1.2; TEST-5/7). Dev-only; core stays dep-free.
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "edit_apply"
harness = false

[[bench]]
name = "line_math"
harness = false
