[package]
name = "ruse-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]

[dev-dependencies]
# Benchmarking harness (D-042). Lean features: keep cargo-bench integration, drop rayon + plotters/gnuplot.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Property-based testing of the semantic invariants (testing §1.2; TEST-5/7). Dev-only; core stays dep-free.
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "edit_apply"
harness = false
